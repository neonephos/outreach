name: Build and Deploy mdBook

on:
  push:
    branches:
      - main
    paths:
      - 'documents/outreach_committee_playbook/**'

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook

      - name: Build mdBook
        run: |
          cd documents/outreach_committee_playbook
          mdbook build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: documents/outreach_committee_playbook/book
