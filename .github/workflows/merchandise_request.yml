name: Handle Merchandise Request

on:
  issues:
    types: [opened]

jobs:
  move-issue-to-pr:
    if: "${{ contains(github.event.issue.title, 'Merchandise') }}"
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Update merchandise inventory file or set up empty commit
        uses: actions/github-script@v7
        id: process-request
        with:
          script: |
            const fs = require('fs');

            const issueBody = context.payload.issue.body || '';
            
            // Extract the selection under the "Merch Relation" section of the issue body
            const merchRelationMatch = issueBody.match(/### Merch Relation\s*\n\s*([^\n\r]+)/);
            const authorization = merchRelationMatch ? merchRelationMatch[1].trim() : '';

            let commitMessage = `Add merchandise request from Issue #${context.issue.number}`;

            if (authorization === 'Yes.') {
              // If authorized, create an empty commit without altering the inventory file
              const { execSync } = require('child_process');
              commitMessage = `Merchandise Request approved for #${context.issue.number}`;
              
              execSync('git config user.name "github-actions[bot]"');
              execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');
              execSync(`git commit --allow-empty -m "${commitMessage}"`);
            } else {
              // Default behavior for "No." or "Unsure."
              const inventoryFile = 'topics/merch/inventory/stock_of_nonallocated_merchandise.csv';

              fs.appendFileSync(
                inventoryFile,
                `\n<<< IF REQUEST #${context.issue.number} APPROVED, INSERT UPDATED MERCH FIGURES HERE (ONLY IF GENERAL MERCH IS AFFECTED. OTHERWISE DO NOT MERGE) >>>`
              );
            }

            // Export commit message for use in the PR step
            core.setOutput('commit_message', commitMessage);

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: "merch-request-${{ github.event.issue.number }}"
          commit-message: ${{ steps.process-request.outputs.commit_message }}
          title: "${{ github.event.issue.title }}"
          body: "This PR has been created from the merchandise request from issue #${{ github.event.issue.number }}. Requestor: An Outreach Committee team member will get in touch with you."
          base: main
          assignees: banannadreams

      - name: Comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const prUrl = "${{ steps.cpr.outputs.pull-request-url }}";
            const issueNumber = context.issue.number;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `Your request has been moved to ${prUrl}.`
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              state: 'closed',
              state_reason: 'completed'
            });
